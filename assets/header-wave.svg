<svg width="100%" height="220" viewBox="0 0 1600 220" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <linearGradient id="bgFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="waveDeep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#990000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#990000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveMid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c1121f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#990000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1a1a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#990000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="220" fill="url(#bgFade)"/>

  <path fill="url(#waveDeep)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
      M0,140 C 200,180 400,100 600,140 C 800,180 1000,100 1200,140 C 1400,180 1500,120 1600,140 L1600,220 L0,220 Z;
      M0,140 C 200,100 400,180 600,140 C 800,100 1000,180 1200,140 C 1400,100 1500,160 1600,140 L1600,220 L0,220 Z;
      M0,140 C 200,180 400,100 600,140 C 800,180 1000,100 1200,140 C 1400,180 1500,120 1600,140 L1600,220 L0,220 Z"/>
  </path>

  <path fill="url(#waveMid)">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="
      M0,160 C 220,120 420,190 620,160 C 820,120 1020,190 1220,160 C 1400,130 1500,180 1600,160 L1600,220 L0,220 Z;
      M0,160 C 220,190 420,120 620,160 C 820,190 1020,120 1220,160 C 1400,190 1500,140 1600,160 L1600,220 L0,220 Z;
      M0,160 C 220,120 420,190 620,160 C 820,120 1020,190 1220,160 C 1400,130 1500,180 1600,160 L1600,220 L0,220 Z"/>
  </path>

  <path fill="none" stroke="url(#waveLine)" stroke-width="1.5">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="
      M0,120 C 200,90 400,150 600,120 C 800,90 1000,150 1200,120 C 1400,90 1500,140 1600,120;
      M0,120 C 200,150 400,90 600,120 C 800,150 1000,90 1200,120 C 1400,150 1500,100 1600,120;
      M0,120 C 200,90 400,150 600,120 C 800,90 1000,150 1200,120 C 1400,90 1500,140 1600,120"/>
  </path>

  <!-- Title Text Layered on Top -->
  <text x="800" y="90" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="120" font-weight="bold" fill="#ffffff" letter-spacing="4" text-anchor="middle" dominant-baseline="middle">AYUSH MALI</text>
</svg>

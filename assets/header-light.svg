<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f6f8fa"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f6f8fa"/>
    </linearGradient>
    
    <linearGradient id="accentGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="50%" style="stop-color:#4CAF50"/>
      <stop offset="100%" style="stop-color:#6C63FF"/>
    </linearGradient>
    
    <linearGradient id="flowGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#6C63FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0"/>
    </linearGradient>

    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes dataFlowL {
      0% { transform: translateX(-200px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(1400px); opacity: 0; }
    }
    @keyframes pulseL {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes orbitXL {
      0% { transform: translateX(-30px); }
      50% { transform: translateX(30px); }
      100% { transform: translateX(-30px); }
    }
    @keyframes nodeGlowL {
      0%, 100% { r: 3; opacity: 0.4; }
      50% { r: 5; opacity: 0.8; }
    }
    .data-stream-l { animation: dataFlowL 8s linear infinite; }
    .data-stream-l-2 { animation: dataFlowL 6s linear infinite; animation-delay: 2s; }
    .data-stream-l-3 { animation: dataFlowL 10s linear infinite; animation-delay: 4s; }
    .pulse-node-l { animation: pulseL 2s ease-in-out infinite; }
    .pulse-node-l-2 { animation: pulseL 2s ease-in-out infinite; animation-delay: 0.5s; }
    .orbit-l { animation: orbitXL 4s ease-in-out infinite; }
    .node-pulse-l { animation: nodeGlowL 3s ease-in-out infinite; }
    .node-pulse-l-2 { animation: nodeGlowL 3s ease-in-out infinite; animation-delay: 1s; }
  </style>

  <rect width="1200" height="300" fill="url(#bgGradL)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="50" x2="1200" y2="50" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="300" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="300" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="300" stroke="#6C63FF" stroke-width="0.5"/>
    <line x1="1000" y1="0" x2="1000" y2="300" stroke="#6C63FF" stroke-width="0.5"/>
  </g>

  <!-- Data streams -->
  <rect class="data-stream-l" x="0" y="80" width="150" height="1" fill="url(#flowGradL)" rx="1"/>
  <rect class="data-stream-l-2" x="0" y="220" width="100" height="1" fill="url(#flowGradL)" rx="1"/>
  <rect class="data-stream-l-3" x="0" y="150" width="200" height="1" fill="url(#flowGradL)" rx="1"/>

  <!-- Nodes -->
  <circle class="node-pulse-l" cx="150" cy="80" r="3" fill="#6C63FF" filter="url(#glowL)"/>
  <circle class="node-pulse-l-2" cx="800" cy="80" r="3" fill="#6C63FF" filter="url(#glowL)"/>
  <circle class="node-pulse-l" cx="1050" cy="220" r="3" fill="#4CAF50" filter="url(#glowL)"/>

  <!-- Orbits -->
  <g class="orbit-l" opacity="0.4">
    <ellipse cx="120" cy="150" rx="40" ry="60" stroke="#6C63FF" stroke-width="0.8" fill="none" opacity="0.3" stroke-dasharray="4 6"/>
  </g>
  <g class="orbit-l" opacity="0.4" style="animation-delay: 2s;">
    <ellipse cx="1080" cy="150" rx="40" ry="60" stroke="#4CAF50" stroke-width="0.8" fill="none" opacity="0.3" stroke-dasharray="4 6"/>
  </g>

  <!-- Title -->
  <text x="600" y="115" font-family="'Courier New', monospace" font-size="48" font-weight="bold" fill="#24292f" text-anchor="middle" letter-spacing="8">AYUSH MALI</text>
  <rect x="350" y="130" width="500" height="2" fill="url(#accentGradL)" rx="1" opacity="0.5"/>
  <text x="600" y="165" font-family="'Courier New', monospace" font-size="14" fill="#6C63FF" text-anchor="middle" letter-spacing="4" opacity="0.9">SYSTEM BUILDER</text>
  <text x="600" y="195" font-family="'Courier New', monospace" font-size="11" fill="#8b949e" text-anchor="middle" letter-spacing="3">COMPUTATIONAL PLATFORMS  ·  BACKEND INTELLIGENCE  ·  ML SYSTEMS</text>

  <!-- Status -->
  <g opacity="0.7">
    <circle class="pulse-node-l" cx="380" cy="240" r="4" fill="#4CAF50"/>
    <text x="392" y="244" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" letter-spacing="2">SYSTEMS ONLINE</text>
    <circle class="pulse-node-l-2" cx="700" cy="240" r="4" fill="#6C63FF"/>
    <text x="712" y="244" font-family="'Courier New', monospace" font-size="9" fill="#8b949e" letter-spacing="2">BUILDING...</text>
  </g>

  <!-- Corners -->
  <g opacity="0.15">
    <path d="M 0 0 L 60 0 L 60 5 M 0 0 L 0 60 L 5 60" stroke="#6C63FF" stroke-width="1.5" fill="none"/>
    <path d="M 1200 0 L 1140 0 L 1140 5 M 1200 0 L 1200 60 L 1195 60" stroke="#6C63FF" stroke-width="1.5" fill="none"/>
    <path d="M 0 300 L 60 300 L 60 295 M 0 300 L 0 240 L 5 240" stroke="#4CAF50" stroke-width="1.5" fill="none"/>
    <path d="M 1200 300 L 1140 300 L 1140 295 M 1200 300 L 1200 240 L 1195 240" stroke="#4CAF50" stroke-width="1.5" fill="none"/>
  </g>

  <rect x="0" y="297" width="1200" height="3" fill="url(#accentGradL)" opacity="0.2"/>
</svg>

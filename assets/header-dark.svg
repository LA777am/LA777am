<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8a074"/>
      <stop offset="50%" style="stop-color:#e8d5b0"/>
      <stop offset="100%" style="stop-color:#b8a074"/>
    </linearGradient>

    <linearGradient id="taglineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b949e"/>
      <stop offset="50%" style="stop-color:#c9d1d9"/>
      <stop offset="100%" style="stop-color:#8b949e"/>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b949e;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8b949e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b949e;stop-opacity:0"/>
    </linearGradient>

    <!-- Radial glow behind title -->
    <radialGradient id="titleBackglow" cx="50%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="titleGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes dataFlow {
      0% { transform: translateX(-200px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(1400px); opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }

    @keyframes nodeGlow {
      0%, 100% { r: 1.5; opacity: 0.3; }
      50% { r: 3; opacity: 0.8; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    @keyframes shimmer {
      0% { opacity: 0; }
      50% { opacity: 0.12; }
      100% { opacity: 0; }
    }

    @keyframes orbitSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes dashDraw {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }

    .data-stream { animation: dataFlow 7s linear infinite; }
    .data-stream-2 { animation: dataFlow 9s linear infinite; animation-delay: 3s; }
    .data-stream-3 { animation: dataFlow 6s linear infinite; animation-delay: 5s; }

    .node-pulse { animation: nodeGlow 4s ease-in-out infinite; }
    .node-pulse-2 { animation: nodeGlow 4s ease-in-out infinite; animation-delay: 1.3s; }
    .node-pulse-3 { animation: nodeGlow 4s ease-in-out infinite; animation-delay: 2.6s; }

    .breathe { animation: breathe 3s ease-in-out infinite; }
    .breathe-slow { animation: breathe 5s ease-in-out infinite; }

    .float { animation: float 6s ease-in-out infinite; }
    .float-delay { animation: float 6s ease-in-out infinite; animation-delay: 3s; }

    .shimmer { animation: shimmer 4s ease-in-out infinite; }

    .orbit { animation: orbitSpin 20s linear infinite; transform-origin: 600px 120px; }
    .orbit-reverse { animation: orbitSpin 25s linear infinite reverse; transform-origin: 600px 120px; }

    .dash-draw { stroke-dasharray: 320; animation: dashDraw 6s ease-in-out infinite alternate; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Radial glow behind title area -->
  <ellipse cx="600" cy="120" rx="420" ry="110" fill="url(#titleBackglow)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.035">
    <circle cx="100" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="200" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="300" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="400" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="500" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="600" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="700" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="800" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="900" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="1000" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="1100" cy="50" r="0.8" fill="#c9a84c"/>
    <circle cx="100" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="200" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="300" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="400" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="800" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="900" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="1000" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="1100" cy="150" r="0.8" fill="#c9a84c"/>
    <circle cx="100" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="200" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="300" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="400" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="500" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="600" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="700" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="800" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="900" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="1000" cy="250" r="0.8" fill="#c9a84c"/>
    <circle cx="1100" cy="250" r="0.8" fill="#c9a84c"/>
  </g>

  <!-- Orbiting rings around title (very subtle, elegant) -->
  <ellipse class="orbit" cx="600" cy="120" rx="280" ry="55" stroke="#c9a84c" stroke-width="0.3" fill="none" opacity="0.06" stroke-dasharray="8 12"/>
  <ellipse class="orbit-reverse" cx="600" cy="120" rx="350" ry="70" stroke="#8b949e" stroke-width="0.2" fill="none" opacity="0.04" stroke-dasharray="5 15"/>

  <!-- Data flow streams -->
  <rect class="data-stream" x="0" y="65" width="100" height="0.6" fill="url(#flowGrad)" rx="1"/>
  <rect class="data-stream-2" x="0" y="235" width="70" height="0.6" fill="url(#flowGrad2)" rx="1"/>
  <rect class="data-stream-3" x="0" y="150" width="130" height="0.6" fill="url(#flowGrad)" rx="1"/>

  <!-- Floating accent nodes -->
  <circle class="node-pulse float" cx="160" cy="65" r="1.5" fill="#c9a84c" filter="url(#glow)"/>
  <circle class="node-pulse-2 float-delay" cx="1040" cy="65" r="1.5" fill="#c9a84c" filter="url(#glow)"/>
  <circle class="node-pulse-3 float" cx="160" cy="235" r="1.5" fill="#8b949e" filter="url(#glow)"/>
  <circle class="node-pulse float-delay" cx="1040" cy="235" r="1.5" fill="#8b949e" filter="url(#glow)"/>

  <!-- Decorative diamond shapes (minimal geometric accents) -->
  <g class="breathe-slow" opacity="0.08">
    <rect x="196" y="115" width="10" height="10" fill="none" stroke="#c9a84c" stroke-width="0.6" transform="rotate(45 201 120)"/>
    <rect x="994" y="115" width="10" height="10" fill="none" stroke="#c9a84c" stroke-width="0.6" transform="rotate(45 999 120)"/>
  </g>

  <!-- Animated dash lines flanking the title -->
  <path class="dash-draw" d="M 160 120 L 320 120" stroke="#c9a84c" stroke-width="0.4" fill="none" opacity="0.12"/>
  <path class="dash-draw" d="M 880 120 L 1040 120" stroke="#c9a84c" stroke-width="0.4" fill="none" opacity="0.12" style="animation-delay: 1s"/>

  <!-- Corner brackets -->
  <g opacity="0.1">
    <path d="M 0 0 L 40 0 L 40 3 M 0 0 L 0 40 L 3 40" stroke="#c9a84c" stroke-width="1" fill="none"/>
    <path d="M 1200 0 L 1160 0 L 1160 3 M 1200 0 L 1200 40 L 1197 40" stroke="#c9a84c" stroke-width="1" fill="none"/>
    <path d="M 0 300 L 40 300 L 40 297 M 0 300 L 0 260 L 3 260" stroke="#8b949e" stroke-width="1" fill="none"/>
    <path d="M 1200 300 L 1160 300 L 1160 297 M 1200 300 L 1200 260 L 1197 260" stroke="#8b949e" stroke-width="1" fill="none"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="300" fill="#f0f3f6" text-anchor="middle" letter-spacing="8" filter="url(#titleGlow)">
    Ayush Mali
  </text>

  <!-- Accent line under title -->
  <rect class="shimmer" x="340" y="137" width="520" height="1.5" fill="#c9a84c" rx="1"/>
  <rect x="370" y="137" width="460" height="1" fill="url(#accentLine)" rx="1"/>

  <!-- Subtitle -->
  <text x="600" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="url(#subtitleGrad)" font-weight="500" text-anchor="middle" letter-spacing="8">
    FULLSTACK DEVELOPER
  </text>

  <!-- Tagline — FIXED: much brighter text -->
  <text x="600" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="url(#taglineGrad)" font-weight="500" text-anchor="middle" letter-spacing="3">
    AI SYSTEMS  ·  BACKEND ENGINEERING  ·  COMPUTATIONAL PLATFORMS
  </text>

  <!-- Status indicators — FIXED: brighter -->
  <g opacity="0.7">
    <circle class="breathe" cx="460" cy="252" r="2.5" fill="#3fb950"/>
    <text x="470" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9ea7b3" font-weight="500" letter-spacing="2">AVAILABLE FOR WORK</text>
    <circle class="breathe" cx="720" cy="252" r="2.5" fill="#c9a84c" style="animation-delay: 1.5s"/>
    <text x="730" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#9ea7b3" font-weight="500" letter-spacing="2">BUILDING</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accentLine)" opacity="0.15"/>
</svg>

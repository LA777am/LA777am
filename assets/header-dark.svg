<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#58a6ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#79c0ff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#79c0ff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes dataFlow {
      0% { transform: translateX(-200px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(1400px); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    @keyframes nodeGlow {
      0%, 100% { r: 2; opacity: 0.4; }
      50% { r: 3.5; opacity: 0.9; }
    }

    .data-stream { animation: dataFlow 6s linear infinite; }
    .data-stream-2 { animation: dataFlow 8s linear infinite; animation-delay: 3s; }
    .data-stream-3 { animation: dataFlow 5s linear infinite; animation-delay: 1.5s; }

    .node-pulse { animation: nodeGlow 3s ease-in-out infinite; }
    .node-pulse-2 { animation: nodeGlow 3s ease-in-out infinite; animation-delay: 1s; }
    .node-pulse-3 { animation: nodeGlow 3s ease-in-out infinite; animation-delay: 2s; }

    .pulse-dot { animation: pulse 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.025">
    <line x1="0" y1="75" x2="1200" y2="75" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="1200" y2="150" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="225" x2="1200" y2="225" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="300" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Data flow streams -->
  <rect class="data-stream" x="0" y="70" width="120" height="0.8" fill="url(#flowGrad)" rx="1"/>
  <rect class="data-stream-2" x="0" y="230" width="80" height="0.8" fill="url(#flowGrad2)" rx="1"/>
  <rect class="data-stream-3" x="0" y="150" width="160" height="0.8" fill="url(#flowGrad)" rx="1"/>

  <!-- Accent nodes -->
  <circle class="node-pulse" cx="180" cy="70" r="2" fill="#58a6ff" filter="url(#glow)"/>
  <circle class="node-pulse-2" cx="1020" cy="70" r="2" fill="#58a6ff" filter="url(#glow)"/>
  <circle class="node-pulse-3" cx="180" cy="230" r="2" fill="#79c0ff" filter="url(#glow)"/>
  <circle class="node-pulse" cx="1020" cy="230" r="2" fill="#79c0ff" filter="url(#glow)"/>

  <!-- Subtle connecting lines -->
  <path d="M 180 70 L 280 70 L 310 150" stroke="#58a6ff" stroke-width="0.4" fill="none" opacity="0.08"/>
  <path d="M 1020 70 L 920 70 L 890 150" stroke="#58a6ff" stroke-width="0.4" fill="none" opacity="0.08"/>

  <!-- Corner brackets -->
  <g opacity="0.12">
    <path d="M 0 0 L 50 0 L 50 4 M 0 0 L 0 50 L 4 50" stroke="#58a6ff" stroke-width="1.2" fill="none"/>
    <path d="M 1200 0 L 1150 0 L 1150 4 M 1200 0 L 1200 50 L 1196 50" stroke="#58a6ff" stroke-width="1.2" fill="none"/>
    <path d="M 0 300 L 50 300 L 50 296 M 0 300 L 0 250 L 4 250" stroke="#79c0ff" stroke-width="1.2" fill="none"/>
    <path d="M 1200 300 L 1150 300 L 1150 296 M 1200 300 L 1200 250 L 1196 250" stroke="#79c0ff" stroke-width="1.2" fill="none"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="6" filter="url(#textGlow)">
    Ayush Mali
  </text>

  <!-- Accent line under title -->
  <rect x="340" y="140" width="520" height="1.5" fill="url(#accentLine)" rx="1"/>

  <!-- Subtitle -->
  <text x="600" y="175" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#58a6ff" font-weight="600" text-anchor="middle" letter-spacing="6">
    FULLSTACK DEVELOPER
  </text>

  <!-- Tagline -->
  <text x="600" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#8b949e" font-weight="400" text-anchor="middle" letter-spacing="3">
    AI SYSTEMS  ·  BACKEND ENGINEERING  ·  COMPUTATIONAL PLATFORMS
  </text>

  <!-- Status indicators -->
  <g opacity="0.6">
    <circle class="pulse-dot" cx="440" cy="252" r="3" fill="#3fb950"/>
    <text x="450" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e" font-weight="500" letter-spacing="2">AVAILABLE FOR WORK</text>
    <circle class="pulse-dot" cx="700" cy="252" r="3" fill="#58a6ff"/>
    <text x="710" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#8b949e" font-weight="500" letter-spacing="2">BUILDING</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accentLine)" opacity="0.2"/>
</svg>

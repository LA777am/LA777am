<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="subtitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8a074"/>
      <stop offset="50%" style="stop-color:#e8d5b0"/>
      <stop offset="100%" style="stop-color:#b8a074"/>
    </linearGradient>

    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#c9a84c;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="flowGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b949e;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#8b949e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#8b949e;stop-opacity:0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="titleGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes dataFlow {
      0% { transform: translateX(-200px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(1400px); opacity: 0; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    @keyframes nodeGlow {
      0%, 100% { r: 1.5; opacity: 0.3; }
      50% { r: 3; opacity: 0.8; }
    }

    @keyframes lineSweep {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    .data-stream { animation: dataFlow 7s linear infinite; }
    .data-stream-2 { animation: dataFlow 9s linear infinite; animation-delay: 3s; }
    .data-stream-3 { animation: dataFlow 6s linear infinite; animation-delay: 5s; }

    .node-pulse { animation: nodeGlow 4s ease-in-out infinite; }
    .node-pulse-2 { animation: nodeGlow 4s ease-in-out infinite; animation-delay: 1.3s; }
    .node-pulse-3 { animation: nodeGlow 4s ease-in-out infinite; animation-delay: 2.6s; }

    .breathe { animation: breathe 3s ease-in-out infinite; }

    .sweep-line {
      stroke-dasharray: 800;
      animation: lineSweep 4s ease-in-out infinite alternate;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04">
    <circle cx="100" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="200" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="300" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="400" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="500" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="600" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="700" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="800" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="900" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="1000" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="1100" cy="50" r="1" fill="#c9a84c"/>
    <circle cx="100" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="200" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="300" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="400" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="500" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="600" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="700" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="800" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="900" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="1000" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="1100" cy="150" r="1" fill="#c9a84c"/>
    <circle cx="100" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="200" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="300" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="400" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="500" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="600" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="700" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="800" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="900" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="1000" cy="250" r="1" fill="#c9a84c"/>
    <circle cx="1100" cy="250" r="1" fill="#c9a84c"/>
  </g>

  <!-- Data flow streams -->
  <rect class="data-stream" x="0" y="65" width="100" height="0.6" fill="url(#flowGrad)" rx="1"/>
  <rect class="data-stream-2" x="0" y="235" width="70" height="0.6" fill="url(#flowGrad2)" rx="1"/>
  <rect class="data-stream-3" x="0" y="150" width="130" height="0.6" fill="url(#flowGrad)" rx="1"/>

  <!-- Accent nodes -->
  <circle class="node-pulse" cx="160" cy="65" r="1.5" fill="#c9a84c" filter="url(#glow)"/>
  <circle class="node-pulse-2" cx="1040" cy="65" r="1.5" fill="#c9a84c" filter="url(#glow)"/>
  <circle class="node-pulse-3" cx="160" cy="235" r="1.5" fill="#8b949e" filter="url(#glow)"/>
  <circle class="node-pulse" cx="1040" cy="235" r="1.5" fill="#8b949e" filter="url(#glow)"/>

  <!-- Corner brackets -->
  <g opacity="0.1">
    <path d="M 0 0 L 40 0 L 40 3 M 0 0 L 0 40 L 3 40" stroke="#c9a84c" stroke-width="1" fill="none"/>
    <path d="M 1200 0 L 1160 0 L 1160 3 M 1200 0 L 1200 40 L 1197 40" stroke="#c9a84c" stroke-width="1" fill="none"/>
    <path d="M 0 300 L 40 300 L 40 297 M 0 300 L 0 260 L 3 260" stroke="#8b949e" stroke-width="1" fill="none"/>
    <path d="M 1200 300 L 1160 300 L 1160 297 M 1200 300 L 1200 260 L 1197 260" stroke="#8b949e" stroke-width="1" fill="none"/>
  </g>

  <!-- Decorative sweep line -->
  <path class="sweep-line" d="M 200 140 Q 400 135 600 140 Q 800 145 1000 140" stroke="#c9a84c" stroke-width="0.3" fill="none" opacity="0.15"/>

  <!-- Main Title -->
  <text x="600" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="300" fill="#f0f3f6" text-anchor="middle" letter-spacing="8" filter="url(#titleGlow)">
    Ayush Mali
  </text>

  <!-- Accent line under title -->
  <rect x="370" y="138" width="460" height="1" fill="url(#accentLine)" rx="1"/>

  <!-- Subtitle -->
  <text x="600" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="url(#subtitleGrad)" font-weight="500" text-anchor="middle" letter-spacing="8">
    FULLSTACK DEVELOPER
  </text>

  <!-- Tagline -->
  <text x="600" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#6e7681" font-weight="400" text-anchor="middle" letter-spacing="3">
    AI SYSTEMS  ·  BACKEND ENGINEERING  ·  COMPUTATIONAL PLATFORMS
  </text>

  <!-- Status indicators -->
  <g opacity="0.5">
    <circle class="breathe" cx="460" cy="252" r="2.5" fill="#3fb950"/>
    <text x="470" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#6e7681" font-weight="500" letter-spacing="2">AVAILABLE FOR WORK</text>
    <circle class="breathe" cx="720" cy="252" r="2.5" fill="#c9a84c" style="animation-delay: 1.5s"/>
    <text x="730" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#6e7681" font-weight="500" letter-spacing="2">BUILDING</text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="298" width="1200" height="2" fill="url(#accentLine)" opacity="0.15"/>
</svg>

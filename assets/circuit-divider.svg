<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" fill="none">
  <defs>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#6C63FF;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#00ff41;stop-opacity:0.5"/>
      <stop offset="80%" style="stop-color:#6C63FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="cGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    @keyframes cPulse {
      0%, 100% { opacity: 0.3; r: 2.5; }
      50% { opacity: 1; r: 4; }
    }
    @keyframes dataPacket {
      0% { transform: translateX(-100px); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateX(1300px); opacity: 0; }
    }
    .c-node { animation: cPulse 2.5s ease-in-out infinite; }
    .c-node-2 { animation: cPulse 2.5s ease-in-out infinite; animation-delay: 0.8s; }
    .c-node-3 { animation: cPulse 2.5s ease-in-out infinite; animation-delay: 1.6s; }
    .packet { animation: dataPacket 5s linear infinite; }
    .packet-2 { animation: dataPacket 7s linear infinite; animation-delay: 2.5s; }
  </style>

  <!-- Main circuit line -->
  <path d="M 0 15 L 200 15 L 220 5 L 350 5 L 370 15 L 500 15 L 520 25 L 680 25 L 700 15 L 830 15 L 850 5 L 980 5 L 1000 15 L 1200 15" 
        stroke="url(#circuitGrad)" stroke-width="1" fill="none"/>

  <!-- Data packets flowing along the line -->
  <rect class="packet" x="0" y="13" width="40" height="3" fill="url(#circuitGrad)" rx="1.5"/>
  <rect class="packet-2" x="0" y="13" width="30" height="3" fill="url(#circuitGrad)" rx="1.5"/>

  <!-- Junction nodes -->
  <circle class="c-node" cx="220" cy="5" r="3" fill="#6C63FF" filter="url(#cGlow)"/>
  <circle class="c-node-2" cx="500" cy="15" r="3" fill="#00ff41" filter="url(#cGlow)"/>
  <circle class="c-node-3" cx="700" cy="15" r="3" fill="#6C63FF" filter="url(#cGlow)"/>
  <circle class="c-node" cx="1000" cy="15" r="3" fill="#00ff41" filter="url(#cGlow)"/>
</svg>
